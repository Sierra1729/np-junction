# NGINX Configuration for KrishiSatya (Next.js Reverse Proxy)
# Place this file in /etc/nginx/sites-available/krishisatya
# and symlink to /etc/nginx/sites-enabled/krishisatya

server {
    listen 80;
    server_name _; # Replace with your domain or server IP

    # Gzip compression
    gzip on;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_types text/plain text/css text/xml application/json application/javascript application/rss+xml application/atom+xml image/svg+xml;

    # Static assets caching
    location /_next/static/ {
        alias /var/www/krishisatya/.next/static/;
        expires 365d;
        access_log off;
    }

    # Public static files
    location /public/ {
        alias /var/www/krishisatya/public/;
        expires 30d;
        access_log off;
    }

    # Reverse proxy to Next.js node server
    location / {
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_cache_bypass $http_upgrade;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
