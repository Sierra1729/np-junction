name: Deploy to Firebase Hosting on PR
on: pull_request
jobs:
  build_and_preview:
    if: '${{ github.event.pull_request.head.repo.full_name == github.repository }}'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
      - run: npm ci --legacy-peer-deps
      - run: npx prisma generate
      - run: npm run build
        env:
          DATABASE_URL: "file:./dev.db"
      - run: node scripts/prepare-hosting.js
      - name: Deploy PR Preview to Firebase Hosting
        env:
          SERVICE_ACCOUNT_KEY: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_NP_JUNCTION }}
        run: |
          node -e 'fs.writeFileSync(process.env.HOME + "/service-account.json", process.env.SERVICE_ACCOUNT_KEY)'
          export GOOGLE_APPLICATION_CREDENTIALS="$HOME/service-account.json"
          npx firebase-tools hosting:channel:deploy "pr-${{ github.event.number }}" --project np-junction --non-interactive
          rm -f "$HOME/service-account.json"
