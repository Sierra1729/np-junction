name: Deploy to Firebase Hosting on PR
on: pull_request
jobs:
  build_and_preview:
    if: '${{ github.event.pull_request.head.repo.full_name == github.repository }}'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
      - run: npm ci --legacy-peer-deps
      - run: npx prisma generate
      - run: npm run build
        env:
          DATABASE_URL: "file:./dev.db"
      - run: node scripts/prepare-hosting.js
      - name: Deploy to Firebase Hosting via CLI
        env:
          FIREBASE_KEY: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_NP_JUNCTION }}
        run: |
          echo "$FIREBASE_KEY" > "$RUNNER_TEMP/firebase-service-account.json"
          export GOOGLE_APPLICATION_CREDENTIALS="$RUNNER_TEMP/firebase-service-account.json"
          npx firebase-tools hosting:channel:deploy "pr-${{ github.event.number }}" --project np-junction
          rm -f "$RUNNER_TEMP/firebase-service-account.json"
