name: Deploy to Firebase Hosting on merge
on:
  push:
    branches:
      - main
jobs:
  build_and_deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
      - run: npm ci --legacy-peer-deps
      - run: npx prisma generate
      - run: npm run build
        env:
          DATABASE_URL: "file:./dev.db"
      - run: node scripts/prepare-hosting.js
      - name: Deploy to Firebase Hosting
        env:
          SERVICE_ACCOUNT_KEY: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_NP_JUNCTION }}
        run: |
          node -e 'fs.writeFileSync(process.env.HOME + "/service-account.json", process.env.SERVICE_ACCOUNT_KEY)'
          export GOOGLE_APPLICATION_CREDENTIALS="$HOME/service-account.json"
          npx firebase-tools deploy --only hosting --project np-junction --non-interactive
          rm -f "$HOME/service-account.json"
